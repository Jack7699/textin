<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Textin</title>
<style>
:root{--p:#2878FF;--bg:#fff;--s:#f3f5f9;--b:#e4e8ef;--t:#14181f;--m:#6b7586;--me:#2878FF;--meT:#fff;--them:#eef1f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141b;--s:#171c25;--b:#262d3a;--t:#eaeef5;--m:#8b95a7;--them:#222a37}}
:root[data-theme=dark]{--bg:#10141b;--s:#171c25;--b:#262d3a;--t:#eaeef5;--m:#8b95a7;--them:#222a37}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,textarea{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:10px 12px;outline:0;width:100%}
input:focus,textarea:focus{border-color:var(--p)}
.btn{background:var(--p);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600}
.ghost{color:var(--p);padding:6px 10px;border-radius:8px}.ghost:hover{background:var(--s)}
#app{display:grid;grid-template-columns:72px 340px 1fr;height:100%}
#nav{border-right:1px solid var(--b);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:var(--s)}
#nav button{width:48px;height:48px;border-radius:14px;font-size:20px;position:relative}
#nav button.on{background:var(--p);color:#fff}
#list{border-right:1px solid var(--b);display:flex;flex-direction:column;min-height:0}
#list header{padding:14px 14px 8px;display:flex;gap:8px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--p)}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--p);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
#rows{overflow:auto;flex:1}
.row{display:flex;gap:12px;padding:10px 14px;align-items:center;cursor:pointer;width:100%;text-align:left}
.row:hover,.row.on{background:var(--s)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;position:relative;background-size:cover}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;background:#22c55e;border:2px solid var(--bg);border-radius:50%}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sm{font-size:12.5px;color:var(--m)}
.badge{background:var(--p);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;font-weight:700}
#chat{display:flex;flex-direction:column;min-height:0;min-width:0}
#chat header{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--b)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--s)}
.m{max-width:min(75%,520px);padding:8px 12px;border-radius:16px;background:var(--them);align-self:flex-start;position:relative;word-wrap:break-word}
.m.me{background:var(--me);color:var(--meT);align-self:flex-end}
.m .meta{font-size:11px;opacity:.7;text-align:right;margin-top:2px}
.m .q{border-left:3px solid var(--p);background:#0001;padding:2px 8px;border-radius:6px;margin-bottom:4px;font-size:13px}
.m .who{font-size:12px;font-weight:700;color:var(--p)}
.m.me .who{color:#fff}
.rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.rx span{background:var(--bg);color:var(--t);border-radius:99px;padding:0 7px;font-size:13px;border:1px solid var(--b)}
.acts{display:none;position:absolute;top:-14px;right:8px;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:2px;box-shadow:0 2px 8px #0002;z-index:2;white-space:nowrap}
.m:hover .acts{display:flex}.acts button{padding:2px 6px;font-size:14px}
.sep{align-self:center;background:var(--bg);border:1px solid var(--b);border-radius:99px;padding:1px 12px;font-size:12px;color:var(--m);margin:6px 0}
#comp{padding:10px;border-top:1px solid var(--b);display:flex;gap:8px;align-items:flex-end;position:relative}
#comp textarea{resize:none;max-height:120px;border-radius:20px}
#emo{position:absolute;bottom:62px;left:10px;background:var(--bg);border:1px solid var(--b);border-radius:14px;padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 6px 24px #0003;z-index:3}
#emo button{font-size:22px;padding:4px}
#bar{padding:6px 14px;font-size:13px;background:var(--s);border-top:1px solid var(--b);display:none;justify-content:space-between}
.empty{margin:auto;text-align:center;color:var(--m);padding:20px}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:10;padding:16px}
.modal>div{background:var(--bg);border-radius:18px;padding:20px;width:min(420px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.back{display:none}
body{background:radial-gradient(1100px 600px at 0% 0%,color-mix(in srgb,var(--p) 16%,var(--bg)),var(--bg))}
.m{animation:pop .2s ease-out;box-shadow:0 1px 3px #0002}@keyframes pop{from{transform:translateY(10px) scale(.95);opacity:0}}
.m.me{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,#7c3aed))}
.row{transition:background .15s,transform .15s}.row:active{transform:scale(.98)}
.btn{box-shadow:0 4px 14px color-mix(in srgb,var(--p) 40%,transparent);transition:transform .15s}.btn:hover{transform:translateY(-1px)}
.av{background-position:center}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--p),#ec4899,#f59e0b,var(--p));display:inline-block;cursor:pointer}.ring.seen{background:var(--b)}.ring .av{border:3px solid var(--bg)}
.stories{display:flex;gap:14px;padding:8px 14px;overflow:auto}.stories>div{text-align:center;font-size:12px;width:62px;flex:none;cursor:pointer}
.pbar{height:4px;background:#8884;border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--p);width:0;transition:width 5s linear}
.dot{position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
video.call{width:100%;border-radius:14px;background:#000}
#in{transition:box-shadow .2s}#in:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 25%,transparent)}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:1fr 60px}
#nav{grid-row:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--b);padding:0}
#list,#chat{grid-row:1;grid-column:1}#chat{display:none}
body.inchat #chat{display:flex}body.inchat #list,body.inchat #nav{display:none}body.inchat #app{grid-template-rows:1fr}
.back{display:block}.m{max-width:85%}}
</style></head><body>
<div id="app">
 <nav id="nav"></nav>
 <section id="list"><header><div class="logo"><i>T</i>Textin</div><span class="grow"></span><button class="ghost" id="newG" title="New group">＋ Group</button></header>
  <div style="padding:0 14px 8px"><input id="q" placeholder="Search chats or find people by @username"></div><div id="rows"></div></section>
 <section id="chat"></section>
</div>
<div class="modal" id="modal"><div id="mbody"></div></div>
<script>
const $=s=>document.querySelector(s), E=['😀','😂','😍','🥳','😎','🤔','😭','😡','👍','👎','🙏','👏','🔥','❤️','🎉','💯','😅','🙌','🤝','👀','✨','🚀','☕','🌍'];
const COL=['#2878FF','#8b5cf6','#ec4899','#f59e0b','#10b981','#ef4444','#06b6d4'];
let db,user,room,meId,me=null,people={},convs=[],cur=null,msgs=[],unsubM=null,replyTo=null,editing=null,tab='all',typing={},lastTyped=0;
const col=id=>COL[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const ini=n=>(n||'?').trim().slice(0,1).toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const online=p=>p&&p.seen&&Date.now()-p.seen<70000;
const dm=(a,b)=>[a,b].sort().join('__');
const rowsOf=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const av=(p,cls='')=>`<div class="av ${cls}" style="background-color:${col(p.id||p.name)};${p.pic?`background-image:url(${p.pic})`:''}">${p.pic?'':esc(ini(p.name))}</div>`;
const cname=c=>c.group?c.name:(people[c.members.find(m=>m!==meId)]||{name:'Unknown'}).name;
const cpeer=c=>c.group?null:people[c.members.find(m=>m!==meId)];
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

(async function init(){
 try{user=await claude.use('user');db=await claude.use('db');room=await claude.use('room')}catch(e){}
 if(!db||!user){$('#chat').innerHTML='<div class="empty"><h2>Sign in to use Textin</h2>Open this page while signed in to claude.ai.</div>';render();return}
 meId=String(await user.id());
 try{const t=localStorage.getItem('tx-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
 const snap=await db.doc('profiles/'+meId).get();
 if(!snap.exists){signup()}else{start()}
})();

function modal(h){ $('#mbody').innerHTML=h; $('#modal').style.display='grid'}
function closeM(){clearTimeout(st);$('#modal').style.display='none'}
$('#modal').onclick=e=>{if(e.target.id==='modal'&&me)closeM()};

function signup(){
 modal(`<div class="logo"><i>T</i>Textin</div><div class="sm">Your people. Your conversations.</div>
 <input id="sn" placeholder="Full name"><input id="su" placeholder="Unique username"><div id="se" class="sm" style="color:#ef4444"></div>
 <button class="btn" id="sgo">Create account</button>`);
 $('#sgo').onclick=async()=>{
  const name=$('#sn').value.trim(),un=$('#su').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!name||un.length<3){$('#se').textContent='Enter a name and a username (3+ letters/numbers).';return}
  const q=await db.collection('profiles').where('username','==',un).get();
  if(!q.empty){$('#se').textContent='That username is taken.';return}
  await db.doc('profiles/'+meId).set({name,username:un,seen:Date.now(),bio:'',showOnline:true});
  closeM();start()};
}

function start(){
 db.doc('profiles/'+meId).onSnapshot(s=>{me={id:meId,...s.data()};if(me.accent)document.documentElement.style.setProperty('--p',me.accent);render()});
 db.collection('profiles').onSnapshot(s=>{people={};rowsOf(s).forEach(p=>people[p.id]=p);render();if(cur)head()});
 db.collection('convs').where('members','array-contains',meId).onSnapshot(s=>{const old=convs;convs=rowsOf(s);msgPing(old);render();if(cur){cur=convs.find(c=>c.id===cur.id)||cur;head()}});
 const beat=()=>db.doc('profiles/'+meId).update({seen:Date.now()}).catch(()=>{});beat();setInterval(beat,30000);
 startMore();if(room){room.on('typing',m=>{if(m.isMe)return;const d=m.data||{};typing[d.c+':'+d.u]=Date.now();head()});setInterval(head,2000)}
 renderNav();
}

function renderNav(){
 const items=[['all','💬','Chats'],['unread','🔵','Unread'],['groups','👥','Groups'],['archived','🗄️','Archived'],['stories','⭕','Status'],['people','📇','People'],['calls','📞','Calls'],['bell','🔔','Notifications'],['settings','⚙️','Settings']];
 $('#nav').innerHTML=items.map(([k,i,l])=>`<button title="${l}" class="${tab===k?'on':''}" data-k="${k}">${i}${k==='bell'&&notifs.some(n=>!n.read)?'<b class="dot">'+notifs.filter(n=>!n.read).length+'</b>':''}</button>`).join('');
 $('#nav').onclick=e=>{const k=e.target.closest('button')?.dataset.k;if(!k)return;if(k==='settings')return settings();if(k==='bell')return bell();tab=k;renderNav();render()};
}

function unreadOf(c){return (c.unread&&c.unread[meId])||0}
function render(){
 if(!me)return;
 const q=$('#q').value.trim().toLowerCase();let h='';if(tab==='stories'&&!q.startsWith('@'))return storiesView();if(tab==='calls'&&!q.startsWith('@'))return callsView();
 if(tab==='people'||q.startsWith('@')){
  const t=q.replace('@','');
  const list=Object.values(people).filter(p=>p.id!==meId&&!(me.blocked||[]).includes(p.id)&&(!t||(p.username||'').includes(t)||(p.name||'').toLowerCase().includes(t)));
  h=list.sort((a,b)=>(b.seen||0)-(a.seen||0)).map(p=>`<button class="row" data-p="${p.id}">${av(p,online(p)&&p.showOnline!==false?'on':'')}<div class="grow"><b>${esc(p.name)}</b><div class="sm">@${esc(p.username)}</div></div>${fbtn(p)}</button>`).join('')||'<div class="empty">No people found yet. Share this page so friends can sign up.</div>';
 }else{
  let l=convs.slice();
  const arch=c=>(c.archived||{})[meId];
  l=l.filter(c=>tab==='archived'?arch(c):!arch(c));
  if(tab==='unread')l=l.filter(c=>unreadOf(c)>0);
  if(tab==='groups')l=l.filter(c=>c.group);
  if(q)l=l.filter(c=>cname(c).toLowerCase().includes(q));
  l.sort((a,b)=>((b.pin||{})[meId]?1:0)-((a.pin||{})[meId]?1:0)||(b.t||0)-(a.t||0));
  h=l.map(c=>{const p=cpeer(c),u=unreadOf(c);return `<button class="row ${cur&&cur.id===c.id?'on':''}" data-c="${c.id}">${c.group?av({name:c.name,id:c.id}):av(p||{name:'?'},p&&online(p)&&p.showOnline!==false?'on':'')}<div class="grow"><div class="ell"><b>${(c.pin||{})[meId]?'📌 ':''}${esc(cname(c))}</b></div><div class="sm ell">${esc(c.last||'No messages yet')}</div></div><div style="text-align:right"><div class="sm">${c.t?tm(c.t):''}</div>${u?`<span class="badge">${u}</span>`:''}</div></button>`}).join('')||'<div class="empty">No chats here yet.<br>Tap <b>📇 People</b> to start one.</div>';
 }
 $('#rows').innerHTML=h;
}
$('#q').oninput=render;
$('#rows').onclick=async e=>{
 const fb=e.target.closest('[data-f]');if(fb)return fAct(fb.dataset.f,fb.dataset.u);const sb=e.target.closest('[data-s]');if(sb)return sb.dataset.s==='new'?newStory():viewStory(sb.dataset.s);const r=e.target.closest('.row');if(!r)return;
 if(r.dataset.p){const id=dm(meId,r.dataset.p);const ex=convs.find(c=>c.id===id);
  if(!ex){await db.doc('convs/'+id).set({members:[meId,r.dataset.p],group:false,t:Date.now(),last:'',unread:{}});if((F[id]||{}).s!=='ok')notify(r.dataset.p,'request',me.name+' wants to chat with you')}
  open(id)}else open(r.dataset.c)};

function open(id){
 cur=convs.find(c=>c.id===id)||{id,members:id.split('__'),group:false};
 if(unsubM)unsubM();document.body.classList.add('inchat');replyTo=editing=null;
 db.doc('convs/'+id).update({['unread.'+meId]:0}).catch(()=>{});
 unsubM=db.collection('convs/'+id+'/messages').orderBy('t').onSnapshot(s=>{msgs=rowsOf(s);paint();markRead()});
 chatShell();render();
}
function markRead(){msgs.filter(m=>m.from!==meId&&!(m.read||[]).includes(meId)&&me.readRcpt!==false).forEach(m=>db.doc('convs/'+cur.id+'/messages/'+m.id).update({read:[...(m.read||[]),meId]}).catch(()=>{}))}

function chatShell(){
 $('#chat').innerHTML=`<header id="hd"></header><div id="msgs"></div><div id="bar"></div>
 <div id="comp"><div id="emo">${E.map(x=>`<button data-e="${x}">${x}</button>`).join('')}</div>
 <button class="ghost" id="bemo">😊</button><label class="ghost" style="cursor:pointer">📎<input type="file" id="file" hidden></label>
 <textarea id="in" rows="1" placeholder="Message"></textarea><button class="ghost" id="mic" title="Voice message">🎤</button><button class="btn" id="send">Send</button></div>`;
 head();
 $('#bemo').onclick=()=>{const e=$('#emo');e.style.display=e.style.display==='grid'?'none':'grid'};
 $('#emo').onclick=e=>{const x=e.target.dataset.e;if(x){$('#in').value+=x;$('#in').focus()}};
 $('#send').onclick=send;
 $('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
 $('#in').oninput=()=>{if(room&&Date.now()-lastTyped>2000){lastTyped=Date.now();room.emit('typing',{c:cur.id,u:meId}).catch(()=>{})}};
 $('#file').onchange=attach;$('#mic').onclick=rec;
}
function head(){
 const hd=$('#hd');if(!hd||!cur)return;const p=cpeer(cur);
 const t=Object.keys(typing).some(k=>k.startsWith(cur.id+':')&&Date.now()-typing[k]<3500);
 const st=t?'typing…':cur.group?cur.members.length+' members':(p&&p.showOnline!==false&&online(p)?'online':'offline');
 hd.innerHTML=`<button class="ghost back" id="bk">←</button>${cur.group?av({name:cur.name,id:cur.id}):av(p||{name:'?'})}<div class="grow"><b>${esc(cname(cur))}</b><div class="sm">${st}</div></div>
 <button class="ghost" id="srch" title="Search">🔍</button><button class="ghost" id="pin" title="Pin chat">📌</button><button class="ghost" id="arc" title="Archive">🗄️</button>
 <button class="ghost" id="ca" title="Audio call">📞</button><button class="ghost" id="cv" title="Video call">🎥</button>${cur.group?'<button class="ghost" id="gi">ℹ️</button>':''}`;
 $('#bk').onclick=()=>{document.body.classList.remove('inchat');cur=null;if(unsubM)unsubM()};
 $('#pin').onclick=()=>db.doc('convs/'+cur.id).update({['pin.'+meId]:!(cur.pin||{})[meId]});
 $('#arc').onclick=()=>db.doc('convs/'+cur.id).update({['archived.'+meId]:!(cur.archived||{})[meId]});
 $('#srch').onclick=()=>{const s=prompt('Search messages in this chat');paint(s)};
 $('#ca').onclick=()=>startCall(false);$('#cv').onclick=()=>startCall(true);window._old=(`<h3>Calls</h3><p>Audio and video calls need a WebRTC signalling and TURN server. A published page can't reach one, so Textin doesn't pretend to place calls here. The Supabase schema includes a <code>calls</code> table ready for signalling.</p><button class="btn" onclick="closeM()">OK</button>`);
 if($('#gi'))$('#gi').onclick=groupInfo;
}

function paint(term){
 const box=$('#msgs');if(!box)return;const stick=box.scrollHeight-box.scrollTop-box.clientHeight<80;
 let last='',h='',shown=msgs;if(term)shown=msgs.filter(m=>(m.text||'').toLowerCase().includes(term.toLowerCase()));
 const firstUnread=msgs.find(m=>m.from!==meId&&!(m.read||[]).includes(meId));
 if(!shown.length)h='<div class="empty">Say hello 👋</div>';
 shown.forEach(m=>{
  const d=new Date(m.t).toDateString();if(d!==last){h+=`<div class="sep">${d===new Date().toDateString()?'Today':d}</div>`;last=d}
  if(firstUnread&&m.id===firstUnread.id)h+='<div class="sep" style="color:var(--p)">Unread messages</div>';
  const mine=m.from===meId,rp=m.reply&&msgs.find(x=>x.id===m.reply);
  const rx=Object.entries(m.rx||{}).filter(([k,v])=>v.length).map(([k,v])=>`<span data-r="${m.id}" data-e="${k}">${k} ${v.length}</span>`).join('');
  const tick=mine?((m.read||[]).length?'<span style="color:#9fe">✓✓</span>':'✓✓'):'';
  h+=`<div class="m ${mine?'me':''}" data-id="${m.id}"><div class="acts"><button data-a="reply" title="Reply">↩️</button><button data-a="react" title="React">😊</button><button data-a="fwd" title="Forward">➡️</button><button data-a="copy" title="Copy">📋</button><button data-a="pinm" title="Pin">📌</button>${mine?'<button data-a="edit" title="Edit">✏️</button><button data-a="del" title="Delete">🗑️</button>':''}</div>
  ${cur.group&&!mine?`<div class="who">${esc((people[m.from]||{}).name||'Someone')}</div>`:''}
  ${rp?`<div class="q">${esc(rp.text||'Attachment')}</div>`:''}
  ${m.deleted?'<i>This message was deleted</i>':`${m.pinned?'📌 ':''}${m.img?`<img src="${m.img}" style="max-width:100%;border-radius:10px;display:block">`:''}${m.vid?`<video src="${m.vid}" controls style="max-width:100%;border-radius:10px"></video>`:''}${m.aud?`<audio src="${m.aud}" controls style="max-width:100%;height:36px"></audio>`:''}${m.doc?`<a href="${m.doc}" target="_blank" style="color:inherit">📄 ${esc(m.fname)}</a>`:''}${esc(m.text||'')}`}
  <div class="meta">${m.edited?'edited · ':''}${tm(m.t)} ${tick}</div>${rx?`<div class="rx">${rx}</div>`:''}</div>`});
 box.innerHTML=h;if(stick||!term)box.scrollTop=box.scrollHeight;
}
$('#chat').addEventListener('click',async e=>{
 const r=e.target.closest('[data-r]');
 if(r)return react(r.dataset.r,r.dataset.e);
 const b=e.target.closest('[data-a]');if(!b)return;
 const id=b.closest('.m').dataset.id,m=msgs.find(x=>x.id===id),a=b.dataset.a,ref=db.doc('convs/'+cur.id+'/messages/'+id);
 if(a==='reply'){replyTo=m;bar('Replying to: '+(m.text||'attachment'));$('#in').focus()}
 if(a==='edit'){editing=m;$('#in').value=m.text;bar('Editing message');$('#in').focus()}
 if(a==='del'&&confirm('Delete this message?'))ref.update({deleted:true,text:'',img:null,vid:null,doc:null});
